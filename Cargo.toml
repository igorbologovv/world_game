[workspace]
resolver = "2"
members = [
    "apps/world-client",
    "apps/world-generator",
    "crates/world-core",
    "crates/world-diagnostics",
    "crates/world-generation",
    "crates/world-player",
    "crates/world-regions",
    "crates/world-terrain",
    "crates/world-vegetation",
    "crates/world-water",
]
exclude = ["Epic_Game_V"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bevy = { version = "0.20.0", features = ["jpeg"] }
bevy_ecs = { version = "0.20.0", default-features = false }
bevy_math = "0.20.0"
big_space = { version = "=0.14.0-rc.0", features = ["i32"] }
image = { version = "0.25", features = ["tiff"] }
noise = "0.9"
world-core = { path = "crates/world-core" }
world-diagnostics = { path = "crates/world-diagnostics" }
world-generation = { path = "crates/world-generation" }
world-regions = { path = "crates/world-regions" }
world-player = { path = "crates/world-player" }
world-terrain = { path = "crates/world-terrain" }
world-vegetation = { path = "crates/world-vegetation" }
world-water = { path = "crates/world-water" }

# Smaller debugging symbols make incremental development faster and reduce
# peak linker memory without removing backtraces/normal debugging entirely.
[profile.dev]
debug = 1
incremental = true

# Optimize engine dependencies once; keep the game's own crate quick to build.
[profile.dev.package."*"]
opt-level = 1
